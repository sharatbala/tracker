<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LittleLog">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#171b2a">
  <title>LittleLog</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">

  <!-- Added defer to ensure DOM elements exist before scripts run -->
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/db-sync.js" defer></script>
  <script src="js/editor.js" defer></script>
  <script src="js/views.js" defer></script>
  <script src="js/trends.js" defer></script>
  <script src="js/history.js" defer></script>
  <script src="js/settings.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header-inner">
        <!-- Left side: Logo & Baby Name -->
        <div class="header-left-group">
          <span style="font-size: 0.75rem; color: #94a3b8; letter-spacing: 0.05em; text-transform: uppercase;">LITTLELOG</span>
          <h1 style="margin: 0; font-size: 1.5rem; font-weight: 700; color: #fff;">Alicia</h1>
        </div>

        <!-- Right side: Sync Status Badge -->
        <div class="header-right-group">
          <div id="sync-status" class="sync-badge synced" style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #cbd5e1;">
            <span style="width: 8px; height: 8px; background-color: #4ade80; border-radius: 50%; display: inline-block;"></span>
            <span id="sync-text">Synced</span>
          </div>
        </div>
      </div>
    </header>

    <main id="home-page" class="page">
      <section id="activity-cards"></section>
      <section id="today-summary" class="today-summary"></section>
    </main>

    <main id="history-page" class="page hidden"></main>
    
    <main id="trends-page" class="page hidden"></main>
    
    <main id="settings-page" class="page hidden"></main>

    <nav class="bottom-nav">
      <!-- Home Tab -->
      <button type="button" class="active" onclick="showHome(this)">
        <span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </span>
        Home
      </button>

      <!-- History Tab -->
      <button type="button" onclick="showHistoryPage(this)">
        <span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </span>
        History
      </button>

      <!-- Trends Tab -->
      <button type="button" onclick="showTrendsPage(this)">
        <span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        </span>
        Trends
      </button>
      
      <!-- Settings Tab -->
      <button type="button" onclick="showSettingsPage(this)">
        <span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
        Settings
      </button>
    </nav>
  </div>

  <div id="overlay-root"></div>
  <div id="loading" class="loading hidden">
    <div class="spinner"></div>
    <span>Loading…</span>
  </div>
  <div id="toast" class="toast hidden"></div>
  
  <div id="editor-overlay" class="editor-overlay hidden">
    <div class="editor">
      <div class="sheet-handle"></div>
      
      <!-- Dynamic Color Header -->
      <div id="editor-header" class="editor-header feed">
        <button type="button" class="close-btn" onclick="closeEditor()">✕</button>
        <h2 id="editor-title">New Feed</h2>
        <button type="button" class="save-btn" onclick="saveEntry()">Save</button>
      </div>

      <!-- Dynamic Form Body -->
      <div id="editor-body" class="editor-body">
        <!-- Injected dynamically via JS based on type -->
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('Service Worker registered successfully!', reg.scope))
          .catch((err) => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
