<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LittleLog">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#171b2a">
  <title>LittleLog</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">

  <!-- Added defer to ensure DOM elements exist before scripts run -->
  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/db-sync.js" defer></script>
  <script src="js/editor.js" defer></script>
  <script src="js/views.js" defer></script>
  <script src="js/history.js" defer></script>
  <script src="js/settings.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="eyebrow">LITTLELOG</div>
      <h1 id="profile-title">Loading…</h1>
      <!-- Example Header Indicator -->
      <div id="sync-status" class="sync-badge synced">
        <span class="sync-dot"></span>
        <span id="sync-text">Synced</span>
      </div>
    </header>

    <main id="home-page" class="page">
      <section id="activity-cards"></section>
      <section id="today-summary" class="today-summary"></section>
    </main>

    <main id="detail-page" class="page hidden"></main>

    
    <main id="history-page" class="page hidden"></main>
    
    <main id="settings-page" class="page hidden"></main>

    <nav class="bottom-nav">
      <button class="active" onclick="showHome(this)">
        <span>✦</span><small>Activity</small>
      </button>
      <button onclick="showHistoryPage(this)">
        <span>▣</span><small>History</small>
      </button>
      <button onclick="showSettingsPage(this)">
        <span>♡</span><small>Settings</small>
      </button>
    </nav>
  </div>

  <div id="overlay-root"></div>
  <div id="loading" class="loading hidden">
    <div class="spinner"></div>
    <span>Loading…</span>
  </div>
  <div id="toast" class="toast hidden"></div>
  
  <div id="editor-overlay" class="editor-overlay hidden">
    <div class="editor">
      <div class="sheet-handle"></div>
      
      <!-- Dynamic Color Header -->
      <div id="editor-header" class="editor-header feed">
        <button type="button" class="close-btn" onclick="closeEditor()">✕</button>
        <h2 id="editor-title">New Feed</h2>
        <button type="button" class="save-btn" onclick="saveEntry()">Save</button>
      </div>

      <!-- Dynamic Form Body -->
      <div id="editor-body" class="editor-body">
        <!-- Injected dynamically via JS based on type -->
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('Service Worker registered successfully!', reg.scope))
          .catch((err) => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
